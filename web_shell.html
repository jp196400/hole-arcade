				g.gain.value = peak;
				src.connect(filter);
				filter.connect(g);
				g.connect(c.destination);

			}

html, body, #canvas {
	margin: 0;

body {

}

}

	left: 8px;
	bottom: 6px;
	z-index: 50;

	right: 0;
	top: 0;

	align-items: center;
	background: #f6f1e8;
	color: #1c2740;

}

}

	font: 600 18px/1.3 "Segoe UI", sans-serif;
	color: #3c4a63;
}

	border-radius: 999px;
	background: #e3d9cc;
	overflow: hidden;
}

	height: 100%;
	width: 0%;
	border-radius: inherit;
	background: #0dbdce;

	box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
	touch-action: manipulation;
}

	display: none;
}

	function displayFailureNotice(err) {
		var detail = 'Something went wrong while starting the game.';
		if (err instanceof Error && err.message) detail = err.message;
		else if (typeof err === 'string' && err) detail = err;
		showFailure('Hole Arcade could not start 3D graphics. ' + detail);
	}

	if (!hasWebGL2()) {
		showFailure('Hole Arcade needs WebGL 2 for its lightweight graphics mode. This browser could not start it. Try the latest Chrome, Edge, Firefox, or Safari, and allow graphics for this site.');
		return;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'This browser is missing features Hole Arcade needs to run:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
		return;
	}
	var bootGate = window.__holeBootGate || Promise.resolve();
	bootGate.then(function () {
		setProgress(0, 0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (statusOverlay.style.visibility === 'hidden') return;
				setProgress(current, total);
			},
		}).then(() => {
			hideLoader();
			if (canvas) {
				canvas.addEventListener('webglcontextlost', function (ev) {
					ev.preventDefault();
					showFailure('Hole Arcade lost the graphics device. Reload the page to try again.');
				}, true);
			}
		}, displayFailureNotice);
	});
}());
		</script>
	</body>
</html>
