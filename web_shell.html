<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- build __BUILD_SHA__ -->
		<script>
		// Safari: block scroll/pinch and cache-bust
		// wasm/pck/js so a new Pages deploy cannot reuse an old build.
		(function () {
			var BUILD = '__BUILD_SHA__';
			window.__BUILD_SHA__ = BUILD;
			function bust(url) {
				if (typeof url !== 'string') {
					return url;
				}
				if (url.indexOf('v=') !== -1) {
					return url;
				}
				if (!/\.(wasm|pck|js|png|svg)(\?|#|$)/.test(url)) {
					return url;
				}
				var hash = url.indexOf('#');
				var base = hash >= 0 ? url.slice(0, hash) : url;
				var frag = hash >= 0 ? url.slice(hash) : '';
				return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'v=' + BUILD + frag;
			}
			var origFetch = window.fetch;
			if (origFetch) {
				window.fetch = function (input, init) {
					if (typeof input === 'string') {
						input = bust(input);
					} else if (typeof Request !== 'undefined' && input instanceof Request) {
						var next = bust(input.url);
						if (next !== input.url) {
							input = new Request(next, input);
						}
					}
					return origFetch.call(this, input, init);
				};
			}
			var origOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function () {
				var args = Array.prototype.slice.call(arguments);
				if (typeof args[1] === 'string') {
					args[1] = bust(args[1]);
				}
				return origOpen.apply(this, args);
			};
			function block(ev) { ev.preventDefault(); }
			document.addEventListener('touchmove', block, { passive: false });
			document.addEventListener('gesturestart', block, { passive: false });
			document.addEventListener('gesturechange', block, { passive: false });
			document.addEventListener('gestureend', block, { passive: false });
			document.addEventListener('DOMContentLoaded', function () {
				var el = document.getElementById('build-sha');
				if (!el) return;
				var debug = /(?:^|[?&])debug=1(?:&|$)/.test(location.search);
				if (!debug) {
					el.style.display = 'none';
					return;
				}
				el.style.display = 'block';
				if (BUILD.indexOf('__') !== 0) {
					el.textContent = BUILD.slice(0, 7);
				}
			});
		})();
		</script>
		<script>
		// SFX are original tones. Music is music.ogg, an original calm loop (see assets/music/LICENSE.txt).
		// The context is created on the first tap so iOS Safari will play it.
		(function () {
			var prefs = { music: true, sfx: true, haptics: true };
			var ctx = null;
			var music = null;
			var musicRate = 1;
			var unlocked = false;
			function ac() {
				var AC = window.AudioContext || window.webkitAudioContext;
				if (!AC) return null;
				if (!ctx) ctx = new AC();
				return ctx;
			}
			function tone(c, type, f0, f1, peak, dur) {
				var now = c.currentTime;
				var o = c.createOscillator();
				var g = c.createGain();
				o.type = type;
				o.frequency.setValueAtTime(Math.max(40, f0), now);
				o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), now + dur);
				g.gain.setValueAtTime(0.0001, now);
				g.gain.exponentialRampToValueAtTime(peak, now + 0.012);
				g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
				o.connect(g);
				g.connect(c.destination);
				o.start(now);
				o.stop(now + dur + 0.02);
			}
			function crunch(c, peak) {
				var dur = 0.12;
				var n = Math.max(1, (dur * c.sampleRate) | 0);
				var buf = c.createBuffer(1, n, c.sampleRate);
				var data = buf.getChannelData(0);
				for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
				var src = c.createBufferSource();
				src.buffer = buf;
				var filter = c.createBiquadFilter();
				filter.type = 'bandpass';
				filter.frequency.value = 480;
				var g = c.createGain();
				g.gain.value = peak;
				src.connect(filter);
				filter.connect(g);
				g.connect(c.destination);
				src.start();
			}
			function stopMusic() {
				if (!music) return;
				try { music.stop(); } catch (err) {}
				music = null;
			}
			function startMusic() {
				if (music || !prefs.music || !unlocked) return;
				var c = ac();
				if (!c) return;
				fetch('music.ogg').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
					return c.decodeAudioData(buf);
				}).then(function (audioBuf) {
					if (!prefs.music || music) return;
					var src = c.createBufferSource();
					src.buffer = audioBuf;
					src.loop = true;
					src.playbackRate.value = musicRate;
					var g = c.createGain();
					g.gain.value = 0.11;
					var warm = c.createBiquadFilter();
					warm.type = 'lowpass';
					warm.frequency.value = 2200;
					warm.Q.value = 0.5;
					src.connect(warm);
					warm.connect(g);
					g.connect(c.destination);
					src.start();
					music = src;
				}).catch(function () {});
			}
			function requestPersist() {
				window.__holePersistRequested = true;
				try {
					if (navigator.storage && navigator.storage.persist) {
						navigator.storage.persist().catch(function () {});
					}
				} catch (err) {}
			}
			var MIRROR_KEY = 'hole-arcade-save';
			window.__holeSaveMirror = function (text) {
				try {
					localStorage.setItem(MIRROR_KEY, String(text));
					return 1;
				} catch (err) {
					return 0;
				}
			};
			window.__holeLoadMirror = function () {
				try {
					return localStorage.getItem(MIRROR_KEY) || '';
				} catch (err) {
					return '';
				}
			};
			window.__holeFlush = null;
			window.__holeSetFlush = function (cb) {
				window.__holeFlush = cb;
			};
			function flushProgress() {
				var cb = window.__holeFlush;
				if (!cb) return;
				try { cb(); } catch (err) {
					window.__holeFlushError = String(err && err.message ? err.message : err);
				}
			}
			document.addEventListener('visibilitychange', function () {
				if (document.visibilityState === 'hidden') flushProgress();
			});
			window.addEventListener('pagehide', flushProgress);
			requestPersist();
			window.__holeUnlock = function () {
				requestPersist();
				var c = ac();
				if (!c) return;
				if (c.state === 'suspended') c.resume();
				unlocked = true;
				if (prefs.music) startMusic();
			};
			window.__holeSetMusicRate = function (rate) {
				var next = Number(rate);
				if (!isFinite(next)) next = 1;
				musicRate = Math.max(0.84, Math.min(1.16, next));
				if (music && music.playbackRate) music.playbackRate.value = musicRate;
			};
			window.__holeSetAudio = function (musicOn, sfxOn) {
				prefs.music = !!musicOn;
				prefs.sfx = !!sfxOn;
				if (!prefs.music) stopMusic();
				else if (unlocked) startMusic();
			};
			window.__holeSetHaptics = function (on) {
				prefs.haptics = !!on;
			};
			// iOS Safari has no Vibration API. A hidden checkbox switch used to buzz
			// when script clicked its label; WebKit 309082 rejects that untrusted
			// click, so a swallow cannot fire an iPhone haptic from here.
			window.__holeHaptic = function (ms) {
				if (!prefs.haptics) return;
				try {
					if (typeof navigator.vibrate === 'function') navigator.vibrate(ms);
				} catch (err) {}
			};
			window.__holePlay = function (kind, pitch, big) {
				try {
					if (!prefs.sfx) return;
					var c = ac();
					if (!c) return;
					if (c.state === 'suspended') c.resume();
					var p = Math.max(0.55, Math.min(2.6, pitch || 1));
					if (kind === 'pop') tone(c, 'sine', 620 * p, 260 * p, 0.05, 0.1);
					else if (kind === 'clunk') tone(c, 'sine', 210 * p, 90 * p, 0.06, 0.14);
					else if (kind === 'crunch') crunch(c, 0.07);
					else if (kind === 'fanfare') {
						tone(c, 'sine', 523, 523, 0.035, 0.14);
						setTimeout(function () { var x = ac(); if (x) tone(x, 'sine', 659, 659, 0.035, 0.14); }, 120);
						setTimeout(function () { var x = ac(); if (x) tone(x, 'sine', 784, 784, 0.04, 0.22); }, 240);
					} else if (kind === 'sting_win') tone(c, 'sine', 392, 660, 0.05, 0.24);
					else if (kind === 'sting_lose') tone(c, 'sine', 311, 140, 0.05, 0.3);
					else if (kind === 'click') tone(c, 'sine', 740, 520, 0.02, 0.05);
					else if (kind === 'beep') tone(c, 'sine', 660 * p, 660 * p, 0.03, 0.1);
					else tone(c, 'sine', 420 * p, 180 * p, 0.05, 0.12);
				} catch (err) {}
			};
			window.__holeSwallow = function (pitch, big) {
				window.__holePlay(big ? 'crunch' : 'pop', pitch, !!big);
			};
			function unlock() { window.__holeUnlock(); }
			document.addEventListener('pointerdown', unlock, { passive: true });
			document.addEventListener('touchstart', unlock, { passive: true });
		})();
		</script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
}

body {
	color: #1c2740;
	background-color: #1c2740;
	overflow: hidden;
	position: fixed;
	width: 100%;
	height: 100%;
}

#canvas {
	display: block;
	touch-action: none;
	background-color: #1c2740;
}

#canvas:focus {
	outline: none;
}

#build-sha {
	display: none;
	position: fixed;
	left: 8px;
	bottom: 6px;
	z-index: 50;
	color: rgba(255, 255, 255, 0.88);
	font: 12px/1.2 ui-monospace, Menlo, Consolas, monospace;
	pointer-events: none;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
}

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: #f6f1e8;
	color: #1c2740;
	z-index: 20;
	visibility: visible;
}

#boot {
	width: min(440px, 86vw);
	text-align: center;
}

#boot-kicker {
	margin: 0 0 8px;
	font: 700 40px/1.1 "Trebuchet MS", "Segoe UI", sans-serif;
	letter-spacing: -0.03em;
}

#boot-title {
	margin: 0 0 22px;
	font: 600 18px/1.3 "Segoe UI", sans-serif;
	color: #3c4a63;
}

#boot-track {
	height: 16px;
	border-radius: 999px;
	background: #e3d9cc;
	overflow: hidden;
}

#boot-fill {
	height: 100%;
	width: 0%;
	border-radius: inherit;
	background: #0dbdce;
}

#boot-fill.indeterminate {
	width: 36%;
	animation: boot-slide 1.15s ease-in-out infinite;
}

@keyframes boot-slide {
	0% { transform: translateX(-130%); }
	100% { transform: translateX(320%); }
}

#boot-pct {
	margin: 12px 0 0;
	font: 700 16px/1 "Segoe UI", sans-serif;
	color: #1c2740;
}

#status-notice {
	display: none;
	max-width: min(460px, 86vw);
	margin: 18px 24px 0;
	font: 500 16px/1.45 "Segoe UI", sans-serif;
	color: #1c2740;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<div id="build-sha">dev</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="boot">
				<p id="boot-kicker">Hole Arcade</p>
				<p id="boot-title">Loading</p>
				<div id="boot-track"><div id="boot-fill" class="indeterminate"></div></div>
				<p id="boot-pct">0%</p>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL?v=__BUILD_SHA__"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
window.__holeEngine = engine;
window.__holeSyncBusy = false;
window.__holeSyncAgain = false;
window.__holeSyncFS = function () {
	var rt = window.__holeEngine && window.__holeEngine.rtenv;
	if (!rt || typeof rt.syncPersistentFS !== 'function') {
		window.__holeSyncAgain = true;
		return;
	}
	if (window.__holeSyncBusy) {
		window.__holeSyncAgain = true;
		return;
	}
	window.__holeSyncBusy = true;
	window.__holeSyncAgain = false;
	var done = function () {
		window.__holeSyncBusy = false;
		if (window.__holeSyncAgain) window.__holeSyncFS();
	};
	try {
		Promise.resolve(rt.syncPersistentFS()).then(done, done);
	} catch (err) {
		done();
	}
};

(function () {
	const statusOverlay = document.getElementById('status');
	const bootTitle = document.getElementById('boot-title');
	const bootTrack = document.getElementById('boot-track');
	const bootFill = document.getElementById('boot-fill');
	const bootPct = document.getElementById('boot-pct');
	const statusNotice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');

	function focusCanvas() {
		if (!canvas) return;
		canvas.setAttribute('tabindex', '0');
		var focus = function () {
			try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); }
		};
		if (!canvas.__holeFocus) {
			canvas.__holeFocus = true;
			canvas.addEventListener('pointerdown', focus, true);
			canvas.addEventListener('touchstart', focus, true);
		}
		focus();
	}
	focusCanvas();

	function hasWebGL2() {
		try {
			var test = document.createElement('canvas');
			var gl = test.getContext('webgl2');
			if (!gl) return false;
			var lose = gl.getExtension('WEBGL_lose_context');
			if (lose) lose.loseContext();
			return true;
		} catch (err) {
			return false;
		}
	}

	let initializing = true;

	function setProgress(current, total) {
		if (!bootFill || !bootPct) return;
		if (current > 0 && total > 0) {
			var pct = Math.max(0, Math.min(100, Math.round(100 * current / total)));
			bootFill.classList.remove('indeterminate');
			bootFill.style.width = pct + '%';
			bootPct.textContent = pct + '%';
		} else {
			bootFill.classList.add('indeterminate');
			bootFill.style.width = '';
			bootPct.textContent = '0%';
		}
	}

	function hideLoader() {
		if (!initializing) return;
		initializing = false;
		statusOverlay.style.visibility = 'hidden';
		statusOverlay.style.pointerEvents = 'none';
		focusCanvas();
	}

	function showFailure(message) {
		console.error(message);
		initializing = false;
		statusOverlay.style.visibility = 'visible';
		statusOverlay.style.pointerEvents = 'auto';
		if (bootTitle) bootTitle.textContent = '3D graphics did not start';
		if (bootTrack) bootTrack.style.display = 'none';
		if (bootPct) bootPct.textContent = '';
		statusNotice.style.display = 'block';
		statusNotice.textContent = message;
	}

	window.__holeGraphicsFailed = function () {
		showFailure('Hole Arcade could not draw the 3D world. Graphics started, but the picture stayed blank. Try the latest Chrome, Edge, Firefox, or Safari, and allow graphics for this site.');
	};

	function displayFailureNotice(err) {
		var detail = 'Something went wrong while starting the game.';
		if (err instanceof Error && err.message) detail = err.message;
		else if (typeof err === 'string' && err) detail = err;
		showFailure('Hole Arcade could not start 3D graphics. ' + detail);
	}

	if (!hasWebGL2()) {
		showFailure('Hole Arcade needs WebGL 2 for its lightweight graphics mode. This browser could not start it. Try the latest Chrome, Edge, Firefox, or Safari, and allow graphics for this site.');
		return;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'This browser is missing features Hole Arcade needs to run:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setProgress(0, 0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (statusOverlay.style.visibility === 'hidden') return;
				setProgress(current, total);
			},
		}).then(() => {
			hideLoader();
			if (canvas) {
				canvas.addEventListener('webglcontextlost', function (ev) {
					ev.preventDefault();
					showFailure('Hole Arcade lost the graphics device. Reload the page to try again.');
				}, true);
			}
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
