<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- build __BUILD_SHA__ -->
		<script>
		// Safari: block scroll/pinch, cap devicePixelRatio, and cache-bust
		// wasm/pck/js so a new Pages deploy cannot reuse an old build.
		(function () {
			var BUILD = '__BUILD_SHA__';
			window.__BUILD_SHA__ = BUILD;
			function bust(url) {
				if (typeof url !== 'string') {
					return url;
				}
				if (url.indexOf('v=') !== -1) {
					return url;
				}
				if (!/\.(wasm|pck|js|png|svg)(\?|#|$)/.test(url)) {
					return url;
				}
				var hash = url.indexOf('#');
				var base = hash >= 0 ? url.slice(0, hash) : url;
				var frag = hash >= 0 ? url.slice(hash) : '';
				return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'v=' + BUILD + frag;
			}
			var origFetch = window.fetch;
			if (origFetch) {
				window.fetch = function (input, init) {
					if (typeof input === 'string') {
						input = bust(input);
					} else if (typeof Request !== 'undefined' && input instanceof Request) {
						var next = bust(input.url);
						if (next !== input.url) {
							input = new Request(next, input);
						}
					}
					return origFetch.call(this, input, init);
				};
			}
			var origOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function () {
				var args = Array.prototype.slice.call(arguments);
				if (typeof args[1] === 'string') {
					args[1] = bust(args[1]);
				}
				return origOpen.apply(this, args);
			};
			function block(ev) { ev.preventDefault(); }
			document.addEventListener('touchmove', block, { passive: false });
			document.addEventListener('gesturestart', block, { passive: false });
			document.addEventListener('gesturechange', block, { passive: false });
			document.addEventListener('gestureend', block, { passive: false });
			try {
				Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return 1; } });
			} catch (err) {}
			document.addEventListener('DOMContentLoaded', function () {
				var el = document.getElementById('build-sha');
				if (el && BUILD.indexOf('__') !== 0) {
					el.textContent = BUILD.slice(0, 7);
				}
			});
		})();
		</script>
		<script>
		// SFX are original tones. Music is music.ogg (CC0, see assets/music/LICENSE.txt).
		// The context is created on the first tap so iOS Safari will play it.
		(function () {
			var prefs = { music: true, sfx: true };
			var ctx = null;
			var music = null;
			var unlocked = false;
			function ac() {
				var AC = window.AudioContext || window.webkitAudioContext;
				if (!AC) return null;
				if (!ctx) ctx = new AC();
				return ctx;
			}
			function tone(c, type, f0, f1, peak, dur) {
				var now = c.currentTime;
				var o = c.createOscillator();
				var g = c.createGain();
				o.type = type;
				o.frequency.setValueAtTime(Math.max(40, f0), now);
				o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), now + dur);
				g.gain.setValueAtTime(0.0001, now);
				g.gain.exponentialRampToValueAtTime(peak, now + 0.012);
				g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
				o.connect(g);
				g.connect(c.destination);
				o.start(now);
				o.stop(now + dur + 0.02);
			}
			function crunch(c, peak) {
				var dur = 0.12;
				var n = Math.max(1, (dur * c.sampleRate) | 0);
				var buf = c.createBuffer(1, n, c.sampleRate);
				var data = buf.getChannelData(0);
				for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
				var src = c.createBufferSource();
				src.buffer = buf;
				var filter = c.createBiquadFilter();
				filter.type = 'bandpass';
				filter.frequency.value = 740;
				var g = c.createGain();
				g.gain.value = peak;
				src.connect(filter);
				filter.connect(g);
				g.connect(c.destination);
				src.start();
			}
			function stopMusic() {
				if (!music) return;
				try { music.stop(); } catch (err) {}
				music = null;
			}
			function startMusic() {
				if (music || !prefs.music || !unlocked) return;
				var c = ac();
				if (!c) return;
				fetch('music.ogg').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
					return c.decodeAudioData(buf);
				}).then(function (audioBuf) {
					if (!prefs.music || music) return;
					var src = c.createBufferSource();
					src.buffer = audioBuf;
					src.loop = true;
					var g = c.createGain();
					g.gain.value = 0.22;
					src.connect(g);
					g.connect(c.destination);
					src.start();
					music = src;
				}).catch(function () {});
			}
			window.__holeUnlock = function () {
				var c = ac();
				if (!c) return;
				if (c.state === 'suspended') c.resume();
				unlocked = true;
				if (prefs.music) startMusic();
			};
			window.__holeSetAudio = function (musicOn, sfxOn) {
				prefs.music = !!musicOn;
				prefs.sfx = !!sfxOn;
				if (!prefs.music) stopMusic();
				else if (unlocked) startMusic();
			};
			window.__holePlay = function (kind, pitch, big) {
				try {
					if (!prefs.sfx) {
						if (big && navigator.vibrate) navigator.vibrate(16);
						return;
					}
					var c = ac();
					if (!c) return;
					if (c.state === 'suspended') c.resume();
					var p = Math.max(0.55, Math.min(2.6, pitch || 1));
					if (kind === 'pop') tone(c, 'sine', 720 * p, 280 * p, 0.08, 0.09);
					else if (kind === 'clunk') tone(c, 'triangle', 240 * p, 90 * p, 0.11, 0.12);
					else if (kind === 'crunch') crunch(c, 0.16);
					else if (kind === 'fanfare') {
						tone(c, 'square', 523, 523, 0.05, 0.12);
						setTimeout(function () { var x = ac(); if (x) tone(x, 'square', 659, 659, 0.05, 0.12); }, 110);
						setTimeout(function () { var x = ac(); if (x) tone(x, 'square', 784, 784, 0.06, 0.2); }, 220);
					} else if (kind === 'sting_win') tone(c, 'triangle', 392, 784, 0.08, 0.22);
					else if (kind === 'sting_lose') tone(c, 'triangle', 330, 110, 0.09, 0.28);
					else if (kind === 'click') tone(c, 'square', 980, 640, 0.035, 0.04);
					else if (kind === 'beep') tone(c, 'square', 880 * p, 880 * p, 0.06, 0.09);
					else tone(c, 'sine', 480 * p, 150 * p, 0.09, 0.12);
					if (big && navigator.vibrate) navigator.vibrate(16);
				} catch (err) {}
			};
			window.__holeSwallow = function (pitch, big) {
				window.__holePlay(big ? 'crunch' : 'pop', pitch, !!big);
			};
			function unlock() { window.__holeUnlock(); }
			document.addEventListener('pointerdown', unlock, { passive: true });
			document.addEventListener('touchstart', unlock, { passive: true });
		})();
		</script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	position: fixed;
	width: 100%;
	height: 100%;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#build-sha {
	position: fixed;
	left: 8px;
	bottom: 6px;
	z-index: 50;
	color: rgba(255, 255, 255, 0.88);
	font: 12px/1.2 ui-monospace, Menlo, Consolas, monospace;
	pointer-events: none;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 2;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<div id="build-sha">dev</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH?v=__BUILD_SHA__" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL?v=__BUILD_SHA__"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
