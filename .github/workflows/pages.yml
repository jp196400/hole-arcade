name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.3 headless and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "${HOME}/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "${HOME}/.local/share/godot/export_templates/4.3.stable/"
          godot --headless --version

      - name: Export Web
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          # Packed into the game so the on-screen label matches this commit even if HTML is cached.
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" main.gd
          grep -q "${GITHUB_SHA}" main.gd
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          cp assets/music/loop.ogg build/web/music.ogg
          test -s build/web/music.ogg
          # Query-string the shell after export. Do not put ?v= on the executable name:
          # Godot would request "index?v=SHA.wasm" and the pack would 404.
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" build/web/index.html
          sed -i "s/index.apple-touch-icon.png/index.apple-touch-icon.png?v=${GITHUB_SHA}/g" build/web/index.html
          sed -i "s/index.icon.png/index.icon.png?v=${GITHUB_SHA}/g" build/web/index.html
          grep -q "index.js?v=${GITHUB_SHA}" build/web/index.html
          grep -q "index.wasm" build/web/index.html
          grep -q "v=${GITHUB_SHA}" build/web/index.html
          grep -q 'version.json?ts=' build/web/index.html
          grep -q 'cache: '"'"'no-store'"'"'' build/web/index.html
          grep -q 'getRegistrations' build/web/index.html
          grep -q 'caches.keys' build/web/index.html
          grep -q 'Update available, tap to reload' build/web/index.html
          ! grep -q '__BUILD_SHA__' build/web/index.html
          ! grep -q 'serviceWorker.register' build/web/index.html
          # thread_support=false: no SharedArrayBuffer / COOP-COEP, so GitHub Pages and phone browsers can run it
          grep -q 'const GODOT_THREADS_ENABLED = false;' build/web/index.html
          # Offline play is not required. This file only replaces a worker a browser
          # already installed, then that worker unregisters itself.
          cp tools/drop-service-worker.js build/web/index.service.worker.js
          grep -q 'skipWaiting' build/web/index.service.worker.js
          grep -q 'unregister' build/web/index.service.worker.js
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > build/web/version.json
          grep -q "\"sha\":\"${GITHUB_SHA}\"" build/web/version.json
          # Godot only copies user:// to IndexedDB on quit. Expose a queued sync so the game can flush after each save.
          python3 tools/patch_web_sync.py build/web/index.js
          grep -q 'syncPersistentFS' build/web/index.js

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Create the Pages site with a workflow source when it does not exist yet.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
